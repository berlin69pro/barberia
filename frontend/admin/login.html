<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CLUB PONTE PERRO | Administrador</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #252525 0%,
                    #111 45%,
                    #080808 100%
                );

            color: white;

        }


        .login-container {

            width: 400px;
            max-width: 90%;

            padding: 40px;

            background: #151515;

            border: 1px solid #333;

            border-radius: 14px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.65);

        }


        .logo {

            text-align: center;

            margin-bottom: 10px;

        }


        .logo h1 {

            font-size: 31px;

            letter-spacing: 2px;

            font-weight: 900;

        }


        .logo span {

            color: #d4af37;

        }


        .subtitulo {

            text-align: center;

            color: #aaa;

            margin-bottom: 30px;

            font-size: 14px;

        }


        .campo {

            margin-bottom: 20px;

        }


        .campo label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #ddd;

        }


        .campo input {

            width: 100%;

            padding: 14px;

            border: 1px solid #444;

            border-radius: 7px;

            background: #222;

            color: white;

            font-size: 15px;

            outline: none;

        }


        .campo input:focus {

            border-color: #d4af37;

            box-shadow:
                0 0 0 2px
                rgba(212, 175, 55, 0.12);

        }


        .btn-login {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #d4af37;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        .btn-login:hover {

            background: #e5c45c;

        }


        .btn-login:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .mensaje {

            margin-top: 20px;

            text-align: center;

            font-size: 14px;

            min-height: 20px;

        }


        .mensaje.error {

            color: #ff7777;

        }


        .mensaje.exito {

            color: #79d98b;

        }


        .volver {

            display: block;

            margin-top: 25px;

            text-align: center;

            color: #aaa;

            text-decoration: none;

            font-size: 14px;

        }


        .volver:hover {

            color: #d4af37;

        }


        .candado {

            text-align: center;

            font-size: 42px;

            margin-bottom: 15px;

        }


        @media (max-width: 500px) {

            .login-container {

                padding: 30px 22px;

            }

            .logo h1 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="candado">
        🔐
    </div>


    <div class="logo">

        <h1>
            CLUB <span>PONTE PERRO</span>
        </h1>

    </div>


    <p class="subtitulo">

        Panel administrativo

    </p>


    <form id="loginForm">


        <div class="campo">

            <label for="usuario">

                Usuario

            </label>


            <input
                type="text"
                id="usuario"
                placeholder="Ingrese su usuario"
                autocomplete="username"
                required
            >

        </div>


        <div class="campo">

            <label for="password">

                Contraseña

            </label>


            <input
                type="password"
                id="password"
                placeholder="Ingrese su contraseña"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn-login"
            id="btnLogin"
        >

            INICIAR SESIÓN

        </button>


        <div
            id="mensaje"
            class="mensaje"
        ></div>


    </form>


    <a
        href="/"
        class="volver"
    >

        ← Volver a la página principal

    </a>


</div>



<script>


// ======================================================
// ELEMENTOS
// ======================================================

const formulario =
    document.getElementById(
        "loginForm"
    );


const usuarioInput =
    document.getElementById(
        "usuario"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


const boton =
    document.getElementById(
        "btnLogin"
    );


// ======================================================
// SI YA EXISTE UNA SESIÓN
// ======================================================

const tokenExistente =
    localStorage.getItem(
        "token"
    );


const usuarioExistente =
    localStorage.getItem(
        "usuario"
    );


if (
    tokenExistente &&
    usuarioExistente
) {

    window.location.href =
        "/admin/dashboard.html";

}


// ======================================================
// LOGIN
// ======================================================

formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const usuario =
            usuarioInput.value.trim();


        const password =
            passwordInput.value;


        if (
            !usuario ||
            !password
        ) {

            mostrarMensaje(
                "Completa usuario y contraseña.",
                "error"
            );

            return;

        }


        boton.disabled =
            true;


        boton.textContent =
            "VERIFICANDO...";


        mostrarMensaje(
            "",
            ""
        );


        try {


            const respuesta =
                await fetch(
                    "/api/auth/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                usuario:
                                    usuario,

                                password:
                                    password

                            })

                    }
                );


            const datos =
                await respuesta.json();


            if (
                !respuesta.ok
            ) {

                throw new Error(
                    datos.error ||
                    "Usuario o contraseña incorrectos."
                );

            }


            // ==================================================
            // GUARDAR SESIÓN
            // ==================================================

            if (
                datos.token
            ) {

                localStorage.setItem(
                    "token",
                    datos.token
                );

            }


            if (
                datos.usuario
            ) {

                localStorage.setItem(
                    "usuario",
                    JSON.stringify(
                        datos.usuario
                    )
                );

            }
            else {

                localStorage.setItem(
                    "usuario",
                    JSON.stringify({

                        nombre:
                            usuario,

                        usuario:
                            usuario

                    })
                );

            }


            mostrarMensaje(
                "✓ Inicio de sesión correcto. Entrando...",
                "exito"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "/admin/dashboard.html";

                },
                500
            );


        }
        catch (error) {

            console.error(
                "❌ Error login:",
                error
            );


            mostrarMensaje(
                error.message ||
                "No se pudo iniciar sesión.",
                "error"
            );


            boton.disabled =
                false;


            boton.textContent =
                "INICIAR SESIÓN";

        }

    }
);


// ======================================================
// MENSAJE
// ======================================================

function mostrarMensaje(
    texto,
    tipo
) {

    mensaje.textContent =
        texto;


    mensaje.className =
        "mensaje";


    if (
        tipo
    ) {

        mensaje.classList.add(
            tipo
        );

    }

}


// ======================================================
// ENTER
// ======================================================

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            formulario.requestSubmit();

        }

    }
);


</script>


</body>

</html>
